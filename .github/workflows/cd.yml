# ──────────────────────────────────────────────────────────────
# CD Pipeline — Inventory Management System
# Triggers on push to main (merge) and on GitHub Releases.
# Steps: build → test → Docker build & push → deploy
# ──────────────────────────────────────────────────────────────

name: CD — Build, Publish & Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_FILE: "Inventory Management System.slnx"
  BUILD_CONFIGURATION: Release
  DOCKER_IMAGE_NAME: inventory-management-system

# Only one deployment at a time
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────
  # 1. Build & Test (gate)
  # ────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test@Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@Password123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=InventoryTestDb;User Id=sa;Password=Test@Password123!;TrustServerCertificate=True"
      ConnectionStrings__RedisCacheUrl: "localhost:6379"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: 🔨 Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: 🧪 Run tests
        run: |
          dotnet test "${{ env.SOLUTION_FILE }}" \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --verbosity normal

  # ────────────────────────────────────────────────────
  # 2. Build & Push Docker Image
  # ────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release

  # ────────────────────────────────────────────────────
  # 3. Deploy to Staging (on push to main)
  # ────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to staging
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  🚀 Deploying to STAGING environment"
          echo "  Image: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:main"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📌 To configure deployment, add one of the following:"
          echo ""
          echo "  Option 1: SSH deploy to your VPS"
          echo "    - Add secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY"
          echo "    - Uncomment the SSH deploy step below"
          echo ""
          echo "  Option 2: Azure App Service"
          echo "    - Add secret: AZURE_WEBAPP_PUBLISH_PROFILE"
          echo "    - Use azure/webapps-deploy@v3 action"
          echo ""
          echo "  Option 3: AWS ECS"
          echo "    - Add secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY"
          echo "    - Use aws-actions/amazon-ecs-deploy-task-definition@v1"

      # ──────── Uncomment for SSH deployment ────────
      # - name: 🔑 Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       docker pull ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:main
      #       docker compose -f /opt/inventory/docker-compose.staging.yml up -d

  # ────────────────────────────────────────────────────
  # 4. Deploy to Production (on release)
  # ────────────────────────────────────────────────────
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'release'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏭 Deploy to production
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  🏭 Deploying to PRODUCTION environment"
          echo "  Version: ${{ github.event.release.tag_name }}"
          echo "  Image: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.release.tag_name }}"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "📌 Configure your production deployment target above."

      # ──────── Uncomment for SSH deployment ────────
      # - name: 🔑 Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.PRODUCTION_HOST }}
      #     username: ${{ secrets.PRODUCTION_USER }}
      #     key: ${{ secrets.PRODUCTION_SSH_KEY }}
      #     script: |
      #       docker pull ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.release.tag_name }}
      #       docker compose -f /opt/inventory/docker-compose.prod.yml up -d
