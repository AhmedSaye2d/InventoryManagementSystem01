# ──────────────────────────────────────────────────────────────
# CI Pipeline — Inventory Management System
# Triggers on every push and pull-request to any branch.
# Steps: restore → build → test → coverage report
# ──────────────────────────────────────────────────────────────

name: CI — Build & Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_FILE: "Inventory Management System.slnx"
  BUILD_CONFIGURATION: Release

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────
  # 1. Build & Lint
  # ────────────────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: 🔨 Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: 📋 Check formatting
        run: dotnet format "${{ env.SOLUTION_FILE }}" --verify-no-changes --verbosity diagnostic
        continue-on-error: true  # Warn but don't fail the build

  # ────────────────────────────────────────────────────
  # 2. Unit Tests
  # ────────────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    services:
      # SQL Server service container for integration tests
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test@Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test@Password123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis service container
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=InventoryTestDb;User Id=sa;Password=Test@Password123!;TrustServerCertificate=True"
      ConnectionStrings__RedisCacheUrl: "localhost:6379"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: 🔨 Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: 🧪 Run tests
        run: |
          dotnet test "${{ env.SOLUTION_FILE }}" \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults
          retention-days: 30

      - name: 📈 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

  # ────────────────────────────────────────────────────
  # 3. Security & Dependency Audit
  # ────────────────────────────────────────────────────
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: 🔒 Check for vulnerable packages
        run: dotnet list "${{ env.SOLUTION_FILE }}" package --vulnerable --include-transitive
        continue-on-error: true

      - name: 🔍 Check for deprecated packages
        run: dotnet list "${{ env.SOLUTION_FILE }}" package --deprecated
        continue-on-error: true
